name: Build Hardened Golden AMI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-test:
    name: Build & Test Golden AMI
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------
      # STEP 1: Install Packer
      # ------------------------------
      - name: Install Packer
        run: |
          cd /tmp
          wget https://releases.hashicorp.com/packer/1.11.2/packer_1.11.2_linux_amd64.zip
          unzip -o packer_1.11.2_linux_amd64.zip
          sudo mv packer /usr/local/bin/
          packer version

      # ------------------------------
      # STEP 2: Configure AWS credentials
      # ------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------
      # STEP 3: Validate Packer template
      # ------------------------------
      - name: Validate Packer template
        run: |
          cd packer
          packer init .
          packer validate .

      # ------------------------------
      # STEP 4: Build the Golden AMI
      # ------------------------------
      - name: Build AMI with Packer
        id: packer_build
        run: |
          cd packer
          packer build golden-image.pkr.hcl 2>&1 | tee packer_output.txt
          
          AMI_ID=$(grep -oP 'ami-[a-z0-9]+' packer_output.txt | tail -1)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Built AMI: $AMI_ID"
          
          echo $AMI_ID > ami_id.txt
          
      # ------------------------------
      # STEP 5: Save AMI ID as artifact
      # ------------------------------
      - name: Save AMI ID artifact
        uses: actions/upload-artifact@v4
        with:
          name: ami-id
          path: packer/ami_id.txt

      # ------------------------------
      # STEP 6: Upload OpenSCAP reports from Packer build
      # ------------------------------
      - name: Upload OpenSCAP reports
        uses: actions/upload-artifact@v4
        with:
          name: openscap-reports
          path: packer/*.html

      # ------------------------------
      # STEP 7: Cleanup old AMIs
      # ------------------------------
      - name: Cleanup old AMIs
        if: always()
        run: |
          aws ec2 describe-images --owners self --filters "Name=name,Values=golden-image-*" --query 'Images | sort_by(@, &CreationDate) | reverse(@) | [3:].ImageId' --output text | xargs -r -n1 aws ec2 deregister-image --image-id