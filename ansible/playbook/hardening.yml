---
- name: Apply CIS-Inspired Hardening to Ubuntu 22.04
  hosts: all
  become: true
  gather_facts: true

  tasks:


    # ==========================================================
    # STEP 1: SSH HARDENING
    # ==========================================================

    - name: Disable root login via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    - name: Disable empty passwords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    - name: Set SSH idle timeout
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*ClientAliveInterval'
        line: 'ClientAliveInterval 300'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    - name: Set SSH max authentication attempts
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*MaxAuthTries'
        line: 'MaxAuthTries 4'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    # ==========================================================
    # STEP 2: PASSWORD POLICY
    # ==========================================================

    - name: Install password quality package
      ansible.builtin.apt:
        name:
          - libpam-pwquality
        state: present
        update_cache: true


    - name: Ensure pwquality.conf exists
      ansible.builtin.file:
        path: /etc/security/pwquality.conf
        state: touch
        owner: root
        group: root
        mode: '0644'


    - name: Enforce password minimum length
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*minlen\s*='
        line: 'minlen = 12'
        state: present


    - name: Enforce password complexity - digit required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*dcredit\s*='
        line: 'dcredit = -1'
        state: present


    - name: Enforce password complexity - uppercase required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*ucredit\s*='
        line: 'ucredit = -1'
        state: present


    - name: Set password maximum age
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS 90'
        state: present


    # ==========================================================
    # STEP 3: SYSTEM HARDENING
    # ==========================================================

    - name: Set system umask to 027
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*UMASK'
        line: 'UMASK 027'
        state: present


    # ==========================================================
    # STEP 4: AUDITING
    # ==========================================================

    - name: Install auditd
      ansible.builtin.apt:
        name:
          - auditd
        state: present
        update_cache: true


    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started


    # ==========================================================
    # STEP 5: OPENSCAP AND SCAP SECURITY GUIDE
    # ==========================================================

    - name: Install OpenSCAP libraries and SCAP Security Guide
      ansible.builtin.apt:
        name:
          - libopenscap8
          - bzip2
          - curl
          - unzip
        state: present
        update_cache: true


    - name: Verify OpenSCAP command is available
      ansible.builtin.command:
        cmd: oscap --version
      register: oscap_version
      changed_when: false


    - name: Display OpenSCAP version
      ansible.builtin.debug:
        var: oscap_version.stdout


  # ============================================================
  # HANDLERS
  # ============================================================

  handlers:

    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted