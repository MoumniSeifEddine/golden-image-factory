---
- name: Apply CIS-Inspired Hardening to Ubuntu 22.04
  hosts: all
  become: true
  gather_facts: true

  tasks:

    # ==========================================================
    # STEP 1: SSH HARDENING (Basic)
    # ==========================================================

    - name: Disable root login via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable empty passwords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Set SSH idle timeout
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*ClientAliveInterval'
        line: 'ClientAliveInterval 300'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Set SSH max authentication attempts
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*MaxAuthTries'
        line: 'MaxAuthTries 4'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    # ==========================================================
    # STEP 2: PASSWORD POLICY
    # ==========================================================

    - name: Install password quality package
      ansible.builtin.apt:
        name: libpam-pwquality
        state: present
        update_cache: true

    - name: Ensure pwquality.conf exists
      ansible.builtin.file:
        path: /etc/security/pwquality.conf
        state: touch
        owner: root
        group: root
        mode: '0644'

    - name: Enforce password minimum length
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*minlen\s*='
        line: 'minlen = 14'
        state: present

    - name: Enforce password complexity - digit required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*dcredit\s*='
        line: 'dcredit = -1'
        state: present

    - name: Enforce password complexity - uppercase required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*ucredit\s*='
        line: 'ucredit = -1'
        state: present

    - name: Enforce password complexity - special char required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*ocredit\s*='
        line: 'ocredit = -1'
        state: present

    - name: Enforce password complexity - lowercase required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*lcredit\s*='
        line: 'lcredit = -1'
        state: present

    - name: Enforce password complexity - minimum character classes
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*minclass\s*='
        line: 'minclass = 4'
        state: present

    - name: Set password hashing algorithm to SHA512
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*ENCRYPT_METHOD'
        line: 'ENCRYPT_METHOD SHA512'
        state: present

    - name: Set password maximum age
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS 90'
        state: present

    - name: Set password minimum age
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MIN_DAYS'
        line: 'PASS_MIN_DAYS 1'
        state: present

    - name: Set password minimum length in login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MIN_LEN'
        line: 'PASS_MIN_LEN 14'
        state: present

    - name: Configure PAM lockout policy (tally2)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^\s*auth\s+required\s+pam_tally2.so'
        line: 'auth required pam_tally2.so deny=5 unlock_time=900 onerr=fail audit'
        state: present
        backup: true

    - name: Configure PAM password reuse policy (pwhistory)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^\s*password\s+required\s+pam_pwhistory.so'
        line: 'password required pam_pwhistory.so use_authtok remember=5'
        state: present
        backup: true

    # ==========================================================
    # STEP 3: SYSTEM HARDENING
    # ==========================================================

    - name: Set system umask to 027
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*UMASK'
        line: 'UMASK 027'
        state: present

    # ==========================================================
    # STEP 4: AUDITING
    # ==========================================================

    - name: Install auditd
      ansible.builtin.apt:
        name: auditd
        state: present
        update_cache: true

    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started

    - name: Ensure audit rules directory has correct permissions
      ansible.builtin.file:
        path: /etc/audit/rules.d/
        state: directory
        owner: root
        group: root
        mode: '0750'

    # ==========================================================
    # STEP 5: OPENSCAP AND SCAP SECURITY GUIDE
    # ==========================================================

    - name: Install OpenSCAP libraries and SCAP Security Guide
      ansible.builtin.apt:
        name:
          - libopenscap8
          - bzip2
          - curl
          - unzip
        state: present
        update_cache: true

    - name: Verify OpenSCAP command is available
      ansible.builtin.command:
        cmd: oscap --version
      register: oscap_version
      changed_when: false

    - name: Display OpenSCAP version
      ansible.builtin.debug:
        var: oscap_version.stdout

    # ==========================================================
    # STEP 6: AIDE (File Integrity Monitoring)
    # ==========================================================

    - name: Install AIDE
      ansible.builtin.apt:
        name: aide
        state: present
        update_cache: true

    - name: Initialize AIDE database
      ansible.builtin.command:
        cmd: aideinit -y -f
      register: aide_init
      changed_when: "'AIDE, version' in aide_init.stdout"
      failed_when: false

    - name: Move AIDE database to standard location
      ansible.builtin.command:
        cmd: mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
      when: aide_init.changed
      changed_when: true

    - name: Configure AIDE to verify audit tools
      ansible.builtin.command:
        cmd: aide --check
      register: aide_check
      changed_when: false
      failed_when: false

    - name: Add AIDE cron job for daily execution
      ansible.builtin.cron:
        name: "Run AIDE daily check"
        job: "/usr/bin/aide --check > /var/log/aide/aide_check.log 2>&1"
        hour: 2
        minute: 0
        user: root

    # ==========================================================
    # STEP 7: SSH HARDENING (Advanced)
    # ==========================================================

    - name: Configure SSH strong ciphers
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*Ciphers'
        line: 'Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr'
        state: present
      notify: Restart SSH

    - name: Configure SSH strong MACs
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*MACs'
        line: 'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com'
        state: present
      notify: Restart SSH

    - name: Configure SSH strong key exchange algorithms
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*KexAlgorithms'
        line: 'KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512'
        state: present
      notify: Restart SSH

    - name: Set SSH LoginGraceTime
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*LoginGraceTime'
        line: 'LoginGraceTime 60'
        state: present
      notify: Restart SSH

    - name: Set SSH LogLevel to INFO
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*LogLevel'
        line: 'LogLevel INFO'
        state: present
      notify: Restart SSH

    - name: Set SSH MaxSessions
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*MaxSessions'
        line: 'MaxSessions 4'
        state: present
      notify: Restart SSH

    - name: Set SSH MaxStartups
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*MaxStartups'
        line: 'MaxStartups 10:30:60'
        state: present
      notify: Restart SSH

    - name: Set SSH ClientAliveCountMax
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*ClientAliveCountMax'
        line: 'ClientAliveCountMax 3'
        state: present
      notify: Restart SSH

    - name: Set SSH ClientAliveInterval (redundant, but keep)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*ClientAliveInterval'
        line: 'ClientAliveInterval 300'
        state: present
      notify: Restart SSH

    - name: Disable SSH HostBasedAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*HostBasedAuthentication'
        line: 'HostBasedAuthentication no'
        state: present
      notify: Restart SSH

    - name: Disable SSH .rhosts support
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*IgnoreRhosts'
        line: 'IgnoreRhosts yes'
        state: present
      notify: Restart SSH

    - name: Disable SSH environment options
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*PermitUserEnvironment'
        line: 'PermitUserEnvironment no'
        state: present
      notify: Restart SSH

    - name: Enable SSH warning banner
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*Banner'
        line: 'Banner /etc/issue.net'
        state: present
      notify: Restart SSH

    # ==========================================================
    # STEP 8: MOUNT OPTIONS FOR /dev/shm
    # ==========================================================

    - name: Ensure /dev/shm is mounted with noexec,nosuid,nodev
      ansible.builtin.mount:
        path: /dev/shm
        src: tmpfs
        fstype: tmpfs
        opts: defaults,noexec,nosuid,nodev
        state: mounted

    # ==========================================================
    # STEP 9: DISABLE UNNECESSARY SERVICES
    # ==========================================================

    - name: Remove telnet client
      ansible.builtin.apt:
        name: telnet
        state: absent

    - name: Remove rsync package
      ansible.builtin.apt:
        name: rsync
        state: absent

    - name: Disable Apport service
      ansible.builtin.systemd:
        name: apport.service
        enabled: false
        state: stopped

    # ==========================================================
    # STEP 10: COMPLETE SYSCTL HARDENING
    # ==========================================================

    - name: Apply base sysctl hardening (already applied, but ensure)
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-cis-hardening.conf
      loop:
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.secure_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.secure_redirects', value: '0' }
        - { name: 'net.ipv4.ip_forward', value: '0' }

    - name: Apply additional sysctl parameters
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-cis-hardening.conf
      loop:
        - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
        - { name: 'net.ipv4.conf.default.log_martians', value: '1' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
        - { name: 'kernel.randomize_va_space', value: '2' }
        - { name: 'fs.suid_dumpable', value: '0' }

  # ============================================================
  # HANDLERS
  # ============================================================

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted