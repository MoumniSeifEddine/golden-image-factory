---
- name: Apply CIS-Inspired Hardening to Ubuntu 22.04
  hosts: all
  become: true
  gather_facts: true

  tasks:


    # ==========================================================
    # STEP 1: SSH HARDENING
    # ==========================================================

    - name: Disable root login via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    - name: Disable empty passwords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    - name: Set SSH idle timeout
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*ClientAliveInterval'
        line: 'ClientAliveInterval 300'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    - name: Set SSH max authentication attempts
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*MaxAuthTries'
        line: 'MaxAuthTries 4'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH


    # ==========================================================
    # STEP 2: PASSWORD POLICY
    # ==========================================================

    - name: Install password quality package
      ansible.builtin.apt:
        name:
          - libpam-pwquality
        state: present
        update_cache: true


    - name: Ensure pwquality.conf exists
      ansible.builtin.file:
        path: /etc/security/pwquality.conf
        state: touch
        owner: root
        group: root
        mode: '0644'


    - name: Enforce password minimum length
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*minlen\s*='
        line: 'minlen = 12'
        state: present


    - name: Enforce password complexity - digit required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*dcredit\s*='
        line: 'dcredit = -1'
        state: present


    - name: Enforce password complexity - uppercase required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*ucredit\s*='
        line: 'ucredit = -1'
        state: present


    - name: Set password maximum age
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS 90'
        state: present


    # ==========================================================
    # STEP 3: SYSTEM HARDENING
    # ==========================================================

    - name: Set system umask to 027
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*UMASK'
        line: 'UMASK 027'
        state: present


    # ==========================================================
    # STEP 4: AUDITING
    # ==========================================================

    - name: Install auditd
      ansible.builtin.apt:
        name:
          - auditd
        state: present
        update_cache: true


    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started


    # ==========================================================
    # STEP 5: OPENSCAP AND SCAP SECURITY GUIDE
    # ==========================================================

    - name: Install OpenSCAP libraries and SCAP Security Guide
      ansible.builtin.apt:
        name:
          - libopenscap8
          - bzip2
          - curl
          - unzip
        state: present
        update_cache: true


    - name: Verify OpenSCAP command is available
      ansible.builtin.command:
        cmd: oscap --version
      register: oscap_version
      changed_when: false


    - name: Display OpenSCAP version
      ansible.builtin.debug:
        var: oscap_version.stdout

    # ==========================================================
    # STEP 6: Install and configure AIDE
    # ==========================================================

    - name: Install AIDE
      ansible.builtin.apt:
        name: aide
        state: present
        update_cache: true

    - name: Initialize AIDE database
      ansible.builtin.command:
        cmd: aideinit -y -f
      register: aide_init
      changed_when: "'AIDE, version' in aide_init.stdout"
      failed_when: false

    - name: Move AIDE database to standard location
      ansible.builtin.command:
        cmd: mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
      when: aide_init.changed
      changed_when: true

    # ==========================================================
    # STEP 7: Harden auditd rules directory permissions
    # ==========================================================

    - name: Ensure audit rules directory has correct permissions
      ansible.builtin.file:
        path: /etc/audit/rules.d/
        state: directory
        owner: root
        group: root
        mode: '0750'


    # ==========================================================
    # STEP 8: Apply CIS kernel parameters (sysctl)
    # ==========================================================

    - name: Apply sysctl hardening parameters
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-cis-hardening.conf
      loop:
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.secure_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.secure_redirects', value: '0' }
        - { name: 'net.ipv4.ip_forward', value: '0' }
  # ============================================================
  # HANDLERS
  # ============================================================

  handlers:

    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted