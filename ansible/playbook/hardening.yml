---
- name: Apply CIS-Inspired Hardening to Ubuntu 22.04
  hosts: all
  become: true
  gather_facts: true

  vars:
    remote_syslog_host: ""
    remote_syslog_port: 514

  tasks:

    # ==========================================================
    # STEP 1: SSH HARDENING
    # ==========================================================

    - name: Ensure dedicated SSH access group exists
      ansible.builtin.group:
        name: ssh-users
        state: present

    - name: Add default Ubuntu account to the SSH access group
      ansible.builtin.user:
        name: ubuntu
        groups: ssh-users
        append: true

    - name: Ensure OpenSSH loads configuration drop-ins
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: 'Include /etc/ssh/sshd_config.d/*.conf'
        insertafter: BOF
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Restrict SSH access to the dedicated administrative group
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^AllowGroups\s+'
        line: 'AllowGroups ssh-users'
        insertafter: '^Include /etc/ssh/sshd_config.d/\*\.conf$'
        state: present
      notify: Restart SSH

    - name: Deploy hardened OpenSSH server configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-golden-image-factory.conf
        owner: root
        group: root
        mode: '0600'
        validate: '/usr/sbin/sshd -t -f %s'
        content: |
          PermitRootLogin no
          PermitEmptyPasswords no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          UsePAM yes
          MaxAuthTries 4
          LoginGraceTime 60
          LogLevel INFO
          MaxSessions 4
          MaxStartups 10:30:60
          ClientAliveInterval 300
          ClientAliveCountMax 3
          HostbasedAuthentication no
          IgnoreRhosts yes
          PermitUserEnvironment no
          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no
          PermitTunnel no
          GatewayPorts no
          Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
          MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
          KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group14-sha256
          Banner /etc/issue.net
      notify: Restart SSH

    - name: Validate complete OpenSSH configuration
      ansible.builtin.command:
        cmd: /usr/sbin/sshd -t
      changed_when: false

    - name: Read effective OpenSSH server configuration
      ansible.builtin.command:
        cmd: /usr/sbin/sshd -T
      register: effective_sshd_config
      changed_when: false

    - name: Verify SSH cryptographic directives are active
      ansible.builtin.assert:
        that:
          - "'ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr' in effective_sshd_config.stdout"
          - "'kexalgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group14-sha256' in effective_sshd_config.stdout"
          - "'macs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256' in effective_sshd_config.stdout"
        fail_msg: "The effective SSH crypto policy differs from the hardened configuration."

    # ==========================================================
    # STEP 2: PASSWORD POLICY
    # ==========================================================

    - name: Install password quality package
      ansible.builtin.apt:
        name: libpam-pwquality
        state: present
        update_cache: true

    - name: Ensure pwquality.conf exists
      ansible.builtin.file:
        path: /etc/security/pwquality.conf
        state: file
        owner: root
        group: root
        mode: '0644'

    - name: Enforce password minimum length
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*minlen\s*='
        line: 'minlen = 14'
        state: present

    - name: Enforce password complexity - digit required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*dcredit\s*='
        line: 'dcredit = -1'
        state: present

    - name: Enforce password complexity - uppercase required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*ucredit\s*='
        line: 'ucredit = -1'
        state: present

    - name: Enforce password complexity - special char required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*ocredit\s*='
        line: 'ocredit = -1'
        state: present

    - name: Enforce password complexity - lowercase required
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*lcredit\s*='
        line: 'lcredit = -1'
        state: present

    - name: Enforce password complexity - minimum character classes
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*minclass\s*='
        line: 'minclass = 4'
        state: present

    - name: Retain Ubuntu's modern yescrypt password hashing default
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*ENCRYPT_METHOD'
        line: 'ENCRYPT_METHOD yescrypt'
        state: present

    - name: Set password maximum age
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS 90'
        state: present

    - name: Set password minimum age
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MIN_DAYS'
        line: 'PASS_MIN_DAYS 1'
        state: present

    - name: Set password minimum length in login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MIN_LEN'
        line: 'PASS_MIN_LEN 14'
        state: present

    # pam_tally2 was removed in Ubuntu 22.04. Use the supported pam_faillock
    # module and wire it into common-auth as well as its policy configuration.
    - name: Configure account lockout policy (faillock)
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^\s*#?\s*{{ item.key }}\s*='
        line: '{{ item.key }} = {{ item.value }}'
        state: present
        create: true
        owner: root
        group: root
        mode: '0644'
      loop:
        - { key: 'deny', value: '5' }
        - { key: 'fail_interval', value: '900' }
        - { key: 'unlock_time', value: '900' }

    - name: Enable PAM faillock pre-authentication check
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        line: 'auth required pam_faillock.so preauth silent deny=5 fail_interval=900 unlock_time=900'
        insertafter: BOF
        state: present
        backup: true

    - name: Enable PAM faillock failure and success accounting
      ansible.builtin.blockinfile:
        path: /etc/pam.d/common-auth
        marker: "# {mark} GOLDEN IMAGE FACTORY FAILLOCK"
        insertafter: '^auth \[success=1 default=ignore\] pam_unix\.so'
        block: |
          auth [default=die] pam_faillock.so authfail deny=5 fail_interval=900 unlock_time=900
          auth sufficient pam_faillock.so authsucc deny=5 fail_interval=900 unlock_time=900
        backup: true

    - name: Enable PAM password quality checks in the password stack
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+requisite\s+pam_pwquality\.so'
        line: 'password requisite pam_pwquality.so retry=3'
        insertbefore: '^password \[success=1 default=ignore\] pam_unix\.so'
        state: present
        backup: true

    - name: Configure PAM password reuse policy (pwhistory)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+requisite\s+pam_pwhistory\.so'
        line: 'password requisite pam_pwhistory.so remember=5 use_authtok'
        insertafter: '^password requisite pam_pwquality\.so'
        state: present
        backup: true

    - name: Ensure PAM Unix password module consumes the checked password token
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password \[success=1 default=ignore\] pam_unix\.so'
        line: 'password [success=1 default=ignore] pam_unix.so obscure yescrypt use_authtok'
        state: present
        backup: true

    - name: Set default inactive period for newly created accounts
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: '^INACTIVE='
        line: 'INACTIVE=30'
        state: present

    - name: Set inactivity period for the default Ubuntu account
      ansible.builtin.command:
        cmd: chage --inactive 30 ubuntu
      changed_when: false

    - name: Ensure dedicated empty su restriction group exists
      ansible.builtin.group:
        name: sugroup
        state: present

    - name: Restrict su to members of the dedicated group
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        line: 'auth required pam_wheel.so use_uid group=sugroup'
        insertafter: '^auth\s+sufficient\s+pam_rootok\.so'
        state: present
        backup: true


    # ==========================================================
    # STEP 3: SYSTEM HARDENING
    # ==========================================================

    - name: Set system umask to 027
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*UMASK'
        line: 'UMASK 027'
        state: present

    - name: Set default umask in system-wide profile
      ansible.builtin.lineinfile:
        path: /etc/profile
        regexp: '^\s*umask\s+'
        line: 'umask 027'
        state: present

    - name: Set default umask for interactive Bash shells
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        regexp: '^\s*umask\s+'
        line: 'umask 027'
        state: present

    - name: Configure interactive shell idle timeout
      ansible.builtin.copy:
        dest: /etc/profile.d/99-session-timeout.sh
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Golden Image Factory
          case "$-" in
            *i*) TMOUT=900; readonly TMOUT; export TMOUT ;;
          esac

    - name: Set TMOUT in the system profile for CIS benchmark compatibility
      ansible.builtin.lineinfile:
        path: /etc/profile
        line: 'TMOUT=900; readonly TMOUT; export TMOUT'
        insertafter: EOF
        state: present

    - name: Set TMOUT in the global Bash configuration
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        line: 'TMOUT=900; readonly TMOUT; export TMOUT'
        insertafter: EOF
        state: present

    - name: Configure local login warning banner
      ansible.builtin.copy:
        dest: /etc/issue
        owner: root
        group: root
        mode: '0644'
        content: "Authorized access only. Activity may be monitored.\n"

    - name: Configure remote login warning banner
      ansible.builtin.copy:
        dest: /etc/issue.net
        owner: root
        group: root
        mode: '0644'
        content: "Authorized access only. Activity may be monitored.\n"

    - name: Create sudo log file if it does not exist
      ansible.builtin.copy:
        dest: /var/log/sudo.log
        content: ""
        force: false
        owner: root
        group: root
        mode: '0600'

    - name: Enforce sudo log file permissions
      ansible.builtin.file:
        path: /var/log/sudo.log
        state: file
        owner: root
        group: root
        mode: '0600'

    - name: Configure sudo logging and re-authentication
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-golden-image-hardening
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
        content: |
          Defaults use_pty
          Defaults logfile="/var/log/sudo.log"
          Defaults timestamp_timeout=0

    # ==========================================================
    # STEP 4: AUDITING
    # ==========================================================

    - name: Install auditd
      ansible.builtin.apt:
        name: auditd
        state: present
        update_cache: true

    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started

    - name: Ensure audit rules directory has correct permissions
      ansible.builtin.file:
        path: /etc/audit/rules.d/
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Install baseline audit rules
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-golden-image.rules
        owner: root
        group: root
        mode: '0640'
        content: |
          ## Identity and authentication files
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          ## Privileged configuration
          -w /etc/sudoers -p wa -k scope
          -w /etc/sudoers.d/ -p wa -k scope
          ## Authentication and access-control configuration
          -w /etc/pam.d/common-auth -p wa -k auth
          -w /etc/security/faillock.conf -p wa -k auth
          -w /etc/ssh/sshd_config -p wa -k sshd
          ## Time changes
          -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
          -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
          ## Audit configuration
          -w /etc/audit/ -p wa -k auditconfig
          -w /var/log/audit/ -p wa -k auditlog

    - name: Find audit rule files for explicit permission enforcement
      ansible.builtin.find:
        paths: /etc/audit/rules.d
        patterns: "*.rules"
        file_type: file
        recurse: false
      register: audit_rule_files

    - name: Set secure ownership and permissions on every audit rule file
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: '0640'
      loop: "{{ audit_rule_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Load audit rules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: false

    # ==========================================================
    # STEP 5: OPENSCAP AND SCAP SECURITY GUIDE
    # ==========================================================

    - name: Install OpenSCAP libraries and SCAP Security Guide
      ansible.builtin.apt:
        name:
          - libopenscap8
          - bzip2
          - curl
          - unzip
        state: present
        update_cache: true

    - name: Verify OpenSCAP command is available
      ansible.builtin.command:
        cmd: oscap --version
      register: oscap_version
      changed_when: false

    - name: Display OpenSCAP version
      ansible.builtin.debug:
        var: oscap_version.stdout

    - name: Install systemd journal remote support package
      ansible.builtin.apt:
        name: systemd-journal-remote
        state: present
        update_cache: true

    - name: Ensure persistent journal storage directory exists
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: '2755'

    - name: Ensure journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure persistent and compressed system journal
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/99-golden-image-hardening.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Journal]
          Compress=yes
          Storage=persistent
      notify: Restart systemd-journald

    - name: Validate approved remote syslog endpoint parameters
      ansible.builtin.assert:
        that:
          - remote_syslog_host is match('^[A-Za-z0-9.-]+$')
          - remote_syslog_port | int >= 1
          - remote_syslog_port | int <= 65535
        fail_msg: "REMOTE_SYSLOG_HOST must be a hostname or IPv4 address and REMOTE_SYSLOG_PORT must be between 1 and 65535."
      when: remote_syslog_host | default('') | length > 0

    - name: Install rsyslog for approved remote log forwarding
      ansible.builtin.apt:
        name: rsyslog
        state: present
        update_cache: true
      when: remote_syslog_host | default('') | length > 0

    - name: Configure TCP forwarding to the approved remote log collector
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/60-golden-image-remote.conf
        owner: root
        group: root
        mode: '0644'
        content: "*.* @@{{ remote_syslog_host }}:{{ remote_syslog_port | default(514) }}"
      when: remote_syslog_host | default('') | length > 0
      notify: Restart rsyslog

    - name: Enable rsyslog when remote forwarding is configured
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started
      when: remote_syslog_host | default('') | length > 0

    # ==========================================================
    # STEP 6: AIDE (File Integrity Monitoring)
    # ==========================================================

    # On Ubuntu 22.04 aide-common has a hard dependency on a mail transfer agent
    # (observed: Postfix and bsd-mailx are installed even without recommends), so
    # Postfix cannot be removed without also removing AIDE. Instead it is kept
    # and configured local-only (inet_interfaces = loopback-only), which satisfies
    # the CIS "MTA must not listen on a non-loopback address" rules.
    - name: Preseed Postfix as "Local only" (non-interactive install)
      ansible.builtin.shell: echo 'postfix postfix/main_mailer_type select Local only' | debconf-set-selections
      changed_when: true

    - name: Install AIDE
      ansible.builtin.apt:
        name:
          - aide
          - aide-common
        state: present
        install_recommends: false
        update_cache: true

    - name: Restrict Postfix to loopback only (required MTA dependency of AIDE)
      ansible.builtin.command: postconf -e "inet_interfaces = loopback-only"
      changed_when: true

    - name: Restart Postfix to apply loopback-only configuration
      ansible.builtin.systemd:
        name: postfix
        enabled: true
        state: restarted
      failed_when: false

    - name: Ensure AIDE log directory exists
      ansible.builtin.file:
        path: /var/log/aide
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Ensure AIDE database directory exists
      ansible.builtin.file:
        path: /var/lib/aide
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Exclude ephemeral temporary files from AIDE monitoring
      ansible.builtin.blockinfile:
        path: /etc/aide/aide.conf
        marker: "# {mark} GOLDEN IMAGE FACTORY TEMPORARY PATH EXCLUSIONS"
        block: |
          !/tmp
          !/var/tmp

    - name: Configure AIDE monitoring for audit tools
      ansible.builtin.blockinfile:
        path: /etc/aide/aide.conf
        marker: "# {mark} GOLDEN IMAGE FACTORY AUDIT TOOL MONITORING"
        block: |
          /usr/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
          /usr/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
          /usr/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
          /usr/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
          /usr/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
          /usr/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512

    - name: Add AIDE cron job for daily execution
      ansible.builtin.cron:
        name: "Run AIDE daily check"
        job: "/usr/bin/aide --config=/etc/aide/aide.conf --check > /var/log/aide/aide_check.log 2>&1"
        hour: 2
        minute: 0
        user: root


    # ==========================================================
    # STEP 7: FIX HIGH SEVERITY – GRUB UEFI Password
    # ==========================================================

    - name: Install GRUB tools
      ansible.builtin.apt:
        name:
          - grub-common
          - grub-efi-amd64-bin
        state: present

    # Never generate or store a plaintext GRUB password in the image build.
    # Supply a precomputed PBKDF2 hash through a protected CI secret.
    - name: Require a protected GRUB password hash for the hardened image
      ansible.builtin.assert:
        that:
          - grub_password_hash | default('') | length > 0
          - (grub_password_hash | default('')) is match('^grub\.pbkdf2\.sha512\.[0-9]+\..+$')
        fail_msg: >-
          Set the GitHub Actions secret GRUB_PASSWORD_HASH to a valid
          grub.pbkdf2.sha512 hash generated with grub-mkpasswd-pbkdf2.
          The image will not be built with an unprotected UEFI bootloader.
      no_log: true

    - name: Configure GRUB superuser and password hash
      ansible.builtin.blockinfile:
        path: /etc/grub.d/40_custom
        marker: "# {mark} ANSIBLE MANAGED GRUB AUTHENTICATION"
        block: |
          set superusers="root"
          password_pbkdf2 root {{ grub_password_hash }}
        create: true
        owner: root
        group: root
        mode: '0755'
      no_log: true
      register: grub_password_configured

    - name: Enable AppArmor kernel parameter in GRUB
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")(?![^"]*\bapparmor=1\b)([^"]*)(")$'
        line: '\1\2 apparmor=1\3'
        backrefs: true
        state: present
      register: grub_apparmor_parameter

    - name: Enable AppArmor security module in GRUB
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")(?![^"]*\bsecurity=apparmor\b)([^"]*)(")$'
        line: '\1\2 security=apparmor\3'
        backrefs: true
        state: present
      register: grub_apparmor_security

    - name: Regenerate GRUB configuration when settings changed
      ansible.builtin.command:
        cmd: update-grub
      when: grub_apparmor_parameter.changed or grub_apparmor_security.changed or (grub_password_configured.changed | default(false))
      changed_when: true

    - name: Verify generated GRUB configuration contains AppArmor parameters
      ansible.builtin.command:
        cmd: grep -Eq '(^| )apparmor=1( |$)' /boot/grub/grub.cfg
      changed_when: false

    - name: Verify generated GRUB configuration contains UEFI password protection
      ansible.builtin.command:
        cmd: grep -q 'password_pbkdf2' /boot/grub/grub.cfg
      changed_when: false

    - name: Restrict GRUB custom configuration permissions
      ansible.builtin.file:
        path: /etc/grub.d/40_custom
        state: file
        owner: root
        group: root
        mode: '0700'

    - name: Restrict generated GRUB configuration permissions
      ansible.builtin.file:
        path: /boot/grub/grub.cfg
        state: file
        owner: root
        group: root
        mode: '0600'

    # ==========================================================
    # STEP 8: FIX HIGH SEVERITY – systemd_timesyncd (NTP)
    # ==========================================================

    - name: Install systemd-timesyncd
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present
        update_cache: true

    - name: Ensure systemd-timesyncd is enabled and running
      ansible.builtin.systemd:
        name: systemd-timesyncd
        enabled: true
        state: started

    - name: Configure NTP servers
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf
        regexp: "^{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?NTP=', line: 'NTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org' }
        - { regexp: '^#?FallbackNTP=', line: 'FallbackNTP=ntp.ubuntu.com' }

    - name: Restart systemd-timesyncd to apply changes
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: restarted


        
    # ==========================================================
    # STEP 10: MOUNT OPTIONS FOR /dev/shm
    # ==========================================================

    - name: Ensure /dev/shm is mounted with noexec,nosuid,nodev
      ansible.builtin.mount:
        path: /dev/shm
        src: tmpfs
        fstype: tmpfs
        opts: defaults,noexec,nosuid,nodev
        state: mounted

    - name: Mount /tmp as a bounded hardened tmpfs
      ansible.builtin.mount:
        path: /tmp
        src: tmpfs
        fstype: tmpfs
        opts: defaults,rw,nosuid,nodev,noexec,relatime,size=512M,mode=1777
        state: mounted

    # ==========================================================
    # STEP 11: DISABLE UNNECESSARY SERVICES
    # ==========================================================

    - name: Remove telnet client
      ansible.builtin.apt:
        name: telnet
        state: absent

    - name: Remove rsync package
      ansible.builtin.apt:
        name: rsync
        state: absent

    - name: Disable Apport service
      ansible.builtin.systemd:
        name: apport.service
        enabled: false
        state: stopped
      failed_when: false

    - name: Remove unused firewall frontend (Postfix is kept because AIDE depends on an MTA)
      ansible.builtin.apt:
        name: ufw
        state: absent
        purge: true

    - name: Verify AIDE configuration survived package removal
      ansible.builtin.stat:
        path: /etc/aide/aide.conf
      register: aide_conf_after_cleanup

    - name: Fail early if AIDE was removed unexpectedly
      ansible.builtin.assert:
        that:
          - aide_conf_after_cleanup.stat.exists
          - aide_conf_after_cleanup.stat.size > 0
        fail_msg: "/etc/aide/aide.conf is missing after removing ufw; aide-common was removed unexpectedly."

    - name: Install nftables firewall
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: true

    - name: Configure default-deny inbound nftables policy
      ansible.builtin.copy:
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: '0644'
        validate: '/usr/sbin/nft -c -f %s'
        content: |
          flush ruleset
          table inet filter {
            chain input {
              type filter hook input priority 0; policy drop;
              iif lo accept
              ip saddr 127.0.0.0/8 iif != lo drop
              ip6 saddr ::1 iif != lo drop
              udp sport 67 udp dport 68 accept
              udp sport 547 udp dport 546 accept
              ct state established,related accept
              ip protocol icmp accept
              meta l4proto ipv6-icmp accept
              tcp dport 22 ct state new accept
            }
            chain forward {
              type filter hook forward priority 0; policy drop;
            }
            chain output {
              type filter hook output priority 0; policy accept;
            }
          }
      notify: Restart nftables

    - name: Enable and start nftables firewall
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started

    - name: Verify nftables configuration is syntactically valid
      ansible.builtin.command:
        cmd: /usr/sbin/nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Verify nftables is enabled for boot
      ansible.builtin.command:
        cmd: systemctl is-enabled nftables
      register: nftables_enabled_check
      changed_when: false
      failed_when: nftables_enabled_check.stdout | trim != 'enabled'

    - name: Set local system log directory permissions
      ansible.builtin.file:
        path: /var/log
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Find ordinary log files requiring restrictive permissions
      ansible.builtin.find:
        paths: /var/log
        file_type: file
        recurse: true
        excludes:
          - wtmp
          - btmp
          - lastlog
          - faillog
      register: ordinary_log_files

    - name: Restrict ordinary log file permissions without changing service ownership
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0640'
      loop: "{{ ordinary_log_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Preserve accounting log permissions for system services
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: utmp
        mode: "{{ item.mode }}"
      loop:
        - { path: '/var/log/wtmp', mode: '0664' }
        - { path: '/var/log/btmp', mode: '0660' }
        - { path: '/var/log/lastlog', mode: '0664' }
      when: item.path is file

    - name: Set SSH daemon configuration permissions
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        state: file
        owner: root
        group: root
        mode: '0600'

    # ==========================================================
    # STEP 12: COMPLETE SYSCTL HARDENING
    # ==========================================================

    - name: Apply base sysctl hardening (already applied, but ensure)
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-z-golden-image-hardening.conf
      loop:
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.secure_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.secure_redirects', value: '0' }
        - { name: 'net.ipv4.ip_forward', value: '0' }

    - name: Enable reverse-path filtering on every detected IPv4 interface
      ansible.builtin.sysctl:
        name: "net.ipv4.conf.{{ item }}.rp_filter"
        value: '1'
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-z-golden-image-hardening.conf
      loop: "{{ ansible_facts.interfaces | difference(['lo']) }}"
      when: ansible_facts.interfaces is defined

    - name: Apply additional sysctl parameters
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-z-golden-image-hardening.conf
      loop:
        - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
        - { name: 'net.ipv4.conf.default.log_martians', value: '1' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
        - { name: 'kernel.randomize_va_space', value: '2' }
        - { name: 'fs.suid_dumpable', value: '0' }

    - name: Set restrictive permissions on cron directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: '/etc/cron.d', mode: '0700' }
        - { path: '/etc/cron.daily', mode: '0700' }
        - { path: '/etc/cron.hourly', mode: '0700' }
        - { path: '/etc/cron.monthly', mode: '0700' }
        - { path: '/etc/cron.weekly', mode: '0700' }

    - name: Set restrictive permissions on system crontab
      ansible.builtin.file:
        path: /etc/crontab
        state: file
        owner: root
        group: root
        mode: '0600'

    - name: Apply IPv6 network hardening
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-z-golden-image-hardening.conf
      loop:
        - { name: 'net.ipv6.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv6.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv6.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv6.conf.default.accept_source_route', value: '0' }
        - { name: 'net.ipv6.conf.all.accept_ra', value: '0' }
        - { name: 'net.ipv6.conf.default.accept_ra', value: '0' }
        - { name: 'net.ipv6.conf.all.forwarding', value: '0' }

    - name: Reload all persistent sysctl configuration in lexical order
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Verify critical IPv4 hardening parameters are active
      ansible.builtin.command:
        cmd: "sysctl -n {{ item.name }}"
      register: sysctl_runtime_check
      changed_when: false
      failed_when: sysctl_runtime_check.stdout | trim != item.value
      loop:
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }

    - name: Verify reverse-path filtering is active on every detected IPv4 interface
      ansible.builtin.command:
        cmd: "sysctl -n net.ipv4.conf.{{ item }}.rp_filter"
      register: interface_rpf_check
      changed_when: false
      failed_when: interface_rpf_check.stdout | trim != '1'
      loop: "{{ ansible_facts.interfaces | difference(['lo']) }}"
      when: ansible_facts.interfaces is defined

    - name: Disable unused kernel modules
      ansible.builtin.copy:
        dest: /etc/modprobe.d/99-golden-image-blacklist.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          install cramfs /bin/false
          blacklist cramfs
          install usb-storage /bin/false
          blacklist usb-storage

    - name: Disable core dumps through limits
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-golden-image-hardening.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          * hard core 0

  # ============================================================
  # HANDLERS
  # ============================================================

  handlers:
    - name: Restart nftables
      ansible.builtin.service:
        name: nftables
        state: restarted

    - name: Restart systemd-journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted