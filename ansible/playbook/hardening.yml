---
- name: Apply CIS-inspired hardening to Ubuntu 22.04
  hosts: all
  become: true
  gather_facts: true

  vars:
    sshd_config: /etc/ssh/sshd_config
    sysctl_config: /etc/sysctl.d/99-golden-image-hardening.conf

  pre_tasks:
    - name: Confirm supported operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("22.04", ">=")
          - ansible_distribution_version is version("24.04", "<")
        fail_msg: "This playbook is tested for Ubuntu 22.04 LTS only."

    - name: Refresh APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    # SSH settings are kept in the main file to remain compatible with the
    # stock Ubuntu 22.04 OpenSSH configuration and Packer's temporary access.
    - name: Harden SSH daemon settings
      ansible.builtin.lineinfile:
        path: "{{ sshd_config }}"
        regexp: "^[# ]*{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
      loop:
        - { key: "PermitRootLogin", value: "no" }
        - { key: "PermitEmptyPasswords", value: "no" }
        - { key: "PasswordAuthentication", value: "no" }
        - { key: "KbdInteractiveAuthentication", value: "no" }
        - { key: "X11Forwarding", value: "no" }
        - { key: "AllowTcpForwarding", value: "no" }
        - { key: "ClientAliveInterval", value: "300" }
        - { key: "ClientAliveCountMax", value: "3" }
        - { key: "MaxAuthTries", value: "4" }
        - { key: "LoginGraceTime", value: "60" }
        - { key: "LogLevel", value: "INFO" }
        - { key: "IgnoreRhosts", value: "yes" }
        - { key: "HostbasedAuthentication", value: "no" }
        - { key: "PermitUserEnvironment", value: "no" }
        - { key: "MACs", value: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com" }
      notify: Validate and restart SSH

    - name: Install security and audit packages
      ansible.builtin.apt:
        name:
          - libpam-pwquality
          - auditd
          - apparmor
          - aide
          - systemd-timesyncd
          - libopenscap8
          - openscap-scanner
          - bzip2
          - curl
          - unzip
        state: present

    - name: Ensure AppArmor is enabled and running
      ansible.builtin.systemd:
        name: apparmor
        enabled: true
        state: started

    - name: Configure password quality policy
      ansible.builtin.copy:
        dest: /etc/security/pwquality.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Golden Image Factory
          minlen = 14
          minclass = 4
          dcredit = -1
          ucredit = -1
          lcredit = -1
          ocredit = -1
          difok = 4
          retry = 3
          enforce_for_root

    - name: Set account aging defaults for newly created users
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        state: present
      loop:
        - { key: "PASS_MAX_DAYS", value: "90" }
        - { key: "PASS_MIN_DAYS", value: "1" }
        - { key: "UMASK", value: "027" }

    - name: Set SHA-512 as the default password hashing method
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^ENCRYPT_METHOD\\s+"
        line: "ENCRYPT_METHOD SHA512"
        state: present

    - name: Set inactive period after password expiration for new accounts
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: "^INACTIVE="
        line: "INACTIVE=30"
        state: present

    - name: Set a warning banner for local and remote logins
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          Authorized access only. Activity may be monitored and recorded.
      loop:
        - /etc/issue
        - /etc/issue.net

    - name: Configure SSH warning banner
      ansible.builtin.lineinfile:
        path: "{{ sshd_config }}"
        regexp: "^#?Banner\\s+"
        line: "Banner /etc/issue.net"
        state: present
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Validate and restart SSH

    - name: Configure sudo logging and reauthentication
      ansible.builtin.copy:
        dest: /etc/sudoers.d/50-golden-image-hardening
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
        content: |
          Defaults logfile="/var/log/sudo.log"
          Defaults timestamp_timeout=5

    - name: Ensure sudo log file exists
      ansible.builtin.file:
        path: /var/log/sudo.log
        state: touch
        owner: root
        group: root
        mode: "0600"

    - name: Enforce session timeout in the system-wide login profile
      ansible.builtin.blockinfile:
        path: /etc/profile
        marker: "# {mark} GOLDEN IMAGE FACTORY SESSION POLICY"
        block: |
          TMOUT=900
          readonly TMOUT
          export TMOUT
          umask 027

    - name: Enforce umask in the system-wide Bash configuration
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        line: "umask 027"
        state: present

    - name: Configure persistent systemd journal
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/50-golden-image.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Journal]
          Storage=persistent
          Compress=yes
      notify: Restart systemd-journald

    - name: Ensure persistent journal directory exists
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"

    - name: Set permissions on cron directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/cron.d
        - /etc/cron.daily
        - /etc/cron.hourly
        - /etc/cron.monthly
        - /etc/cron.weekly

    - name: Set permissions on system crontab
      ansible.builtin.file:
        path: /etc/crontab
        state: file
        owner: root
        group: root
        mode: "0600"

    - name: Restrict SSH daemon configuration permissions
      ansible.builtin.file:
        path: "{{ sshd_config }}"
        state: file
        owner: root
        group: root
        mode: "0600"

    - name: Ensure audit rules directory exists
      ansible.builtin.file:
        path: /etc/audit/rules.d
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install baseline audit rules
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-golden-image.rules
        owner: root
        group: root
        mode: "0640"
        content: |
          # Managed by Golden Image Factory
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/sudoers -p wa -k scope
          -w /etc/sudoers.d/ -p wa -k scope
          -w /var/log/auth.log -p wa -k authlog
          -e 2
      notify: Load audit rules

    - name: Enable and start auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started

    - name: Ensure systemd configuration drop-in directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/systemd/timesyncd.conf.d
        - /etc/systemd/journald.conf.d

    - name: Configure system time synchronization
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/50-golden-image.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Time]
          NTP=ntp.ubuntu.com
          FallbackNTP=0.pool.ntp.org 1.pool.ntp.org
      notify: Restart systemd-timesyncd

    - name: Ensure systemd-timesyncd is enabled
      ansible.builtin.systemd:
        name: systemd-timesyncd
        enabled: true
        state: started

    - name: Configure kernel and network hardening
      ansible.builtin.copy:
        dest: "{{ sysctl_config }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Golden Image Factory
          kernel.randomize_va_space = 2
          fs.suid_dumpable = 0
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv6.conf.all.accept_redirects = 0
          net.ipv6.conf.default.accept_redirects = 0
          net.ipv6.conf.all.accept_source_route = 0
          net.ipv6.conf.default.accept_source_route = 0
          net.ipv6.conf.all.accept_ra = 0
          net.ipv6.conf.default.accept_ra = 0
          net.ipv6.conf.all.forwarding = 0
          net.ipv6.conf.default.forwarding = 0
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.default.log_martians = 1
          net.ipv4.icmp_echo_ignore_broadcasts = 1
          net.ipv4.icmp_ignore_bogus_error_responses = 1
          net.ipv4.tcp_syncookies = 1
      notify: Apply sysctl settings

    - name: Persist restrictive shared-memory mount options
      ansible.builtin.mount:
        path: /dev/shm
        src: tmpfs
        fstype: tmpfs
        opts: defaults,nosuid,nodev,noexec
        state: mounted

    - name: Remove unused Telnet client
      ansible.builtin.apt:
        name: telnet
        state: absent
        purge: true

    - name: Remove Apport crash reporting package
      ansible.builtin.apt:
        name: apport
        state: absent
        purge: true

    - name: Remove UFW package when host firewall policy is managed externally
      ansible.builtin.apt:
        name: ufw
        state: absent
        purge: true

    - name: Disable unused cramfs and USB storage kernel modules
      ansible.builtin.copy:
        dest: /etc/modprobe.d/99-golden-image-blacklist.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          install cramfs /bin/false
          blacklist cramfs
          install usb-storage /bin/false
          blacklist usb-storage


    - name: Disable core dumps for user sessions
      ansible.builtin.copy:
        dest: /etc/security/limits.d/99-golden-image-coredumps.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          * hard core 0
          root hard core 0

    - name: Ensure AIDE daily integrity check is scheduled
      ansible.builtin.cron:
        name: "Golden Image Factory AIDE integrity check"
        job: "/usr/bin/aide --check >> /var/log/aide-check.log 2>&1"
        hour: "2"
        minute: "0"
        user: root

    - name: Verify OpenSCAP is installed
      ansible.builtin.command:
        cmd: oscap --version
      changed_when: false

    - name: Validate SSH configuration before finishing
      ansible.builtin.command:
        cmd: /usr/sbin/sshd -t
      changed_when: false

  handlers:
    - name: Validate and restart SSH
      ansible.builtin.shell:
        cmd: "/usr/sbin/sshd -t && systemctl restart ssh"
        executable: /bin/bash

    - name: Load audit rules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: true

    - name: Restart systemd-timesyncd
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: restarted

    - name: Apply sysctl settings
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: Restart systemd-journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
